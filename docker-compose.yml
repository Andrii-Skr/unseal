services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unseal
      POSTGRES_USER: unseal
      POSTGRES_PASSWORD: unseal
    ports:
      - "5433:5432"
    volumes:
      - unseal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unseal -d unseal"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unseal_test
      POSTGRES_USER: unseal
      POSTGRES_PASSWORD: unseal
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unseal -d unseal_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  unseal-postgres:
